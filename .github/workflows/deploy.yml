# Deploys sixprolasers.com to Cloudflare Pages on every push to main.
#
# The live site is the existing Direct Upload Pages project "sixpro", whose
# production branch is "production" — hence --branch=production below.
#
# One-time setup in GitHub → repo → Settings → Secrets and variables → Actions:
#   Secrets:   CLOUDFLARE_API_TOKEN   (token with "Account · Cloudflare Pages · Edit")
#              CLOUDFLARE_ACCOUNT_ID  (Cloudflare dashboard → Workers & Pages → right sidebar)
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build dist/
        run: bash build.sh

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=sixpro --branch=production --commit-dirty=true
